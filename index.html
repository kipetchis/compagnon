<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b1530">
  <title>Mon compagnon</title>
  <style>
    :root {
      --fond-haut: #2c2350;
      --fond-bas: #0e0b1c;
      --texte: #f1ecff;
      --texte-doux: #b9b0d6;
      --accent: #ffb86b;
      --accent-texte: #2a1a05;
      --ecoute: #ff6b8a;
      --erreur: #ff9b9b;
      --verre: rgba(20, 15, 40, .72);
      --bord: rgba(255, 255, 255, .14);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(120% 80% at 50% 25%, var(--fond-haut), var(--fond-bas));
      color: var(--texte);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }

    /* ----- Chargement ----- */
    #chargement {
      position: fixed; inset: 0; z-index: 10;
      display: grid; place-items: center;
      padding: 16px; text-align: center;
      transition: opacity .6s;
    }
    #chargement.cache { opacity: 0; pointer-events: none; }
    #message { font-size: 17px; }
    #message.erreur { color: var(--erreur); line-height: 1.5; }
    .barre-chargement {
      width: min(240px, 70vw); height: 6px; margin: 14px auto 0;
      border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden;
    }
    #progression { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }

    /* ----- Bulle (sous-titres et petits messages) ----- */
    #bulle {
      position: fixed; left: 16px; right: 16px;
      bottom: calc(92px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
      padding: 12px 16px; border-radius: 18px;
      background: var(--verre); border: 1px solid var(--bord);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      font-size: 16px; line-height: 1.45; text-align: center;
      opacity: 0; transform: translateY(8px);
      transition: opacity .35s, transform .35s;
      pointer-events: none;
    }
    #bulle.visible { opacity: 1; transform: none; }
    #bulle.info { color: var(--texte-doux); }

    /* ----- Barre du bas : saisie + micro ----- */
    #barre {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; gap: 10px; align-items: center;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
      opacity: 0; transition: opacity .6s;
    }
    #barre.visible { opacity: 1; }
    #formulaire {
      flex: 1; display: flex; align-items: center; min-width: 0;
      background: var(--verre); border: 1px solid var(--bord); border-radius: 26px;
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      padding: 4px 4px 4px 16px;
    }
    #champ {
      flex: 1; min-width: 0; height: 44px;
      background: transparent; border: 0; outline: none;
      color: var(--texte); font: inherit; font-size: 16px;
      -webkit-user-select: text; user-select: text;
    }
    #champ::placeholder { color: var(--texte-doux); }
    button {
      flex: none; display: grid; place-items: center;
      border: 0; border-radius: 50%; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    button svg { width: 22px; height: 22px; }
    #envoyer { width: 44px; height: 44px; background: transparent; color: var(--accent); }
    #envoyer:disabled { color: var(--texte-doux); opacity: .5; }
    #micro {
      width: 56px; height: 56px;
      background: var(--accent); color: var(--accent-texte);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .35);
      transition: background .2s, transform .2s;
    }
    #micro svg { width: 26px; height: 26px; }
    #micro:active { transform: scale(.94); }
    #micro.ecoute { background: var(--ecoute); animation: pulse 1.2s ease-in-out infinite; }
    #micro[hidden] { display: none; }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 107, 138, .55); }
      50% { box-shadow: 0 0 0 12px rgba(255, 107, 138, 0); }
    }

    /* ----- Bouton du carnet (en haut à droite) ----- */
    #ouvrir-carnet {
      position: fixed; right: 16px; top: calc(12px + env(safe-area-inset-top));
      width: 44px; height: 44px;
      background: var(--verre); border: 1px solid var(--bord); color: var(--texte);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      opacity: 0; pointer-events: none; transition: opacity .6s;
    }
    #ouvrir-carnet.visible { opacity: 1; pointer-events: auto; }

    /* ----- Petite note « Noté dans mon carnet » ----- */
    #note {
      position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top));
      transform: translate(-50%, -12px);
      max-width: calc(100% - 140px);
      padding: 8px 14px; border-radius: 16px;
      background: var(--verre); border: 1px solid var(--bord);
      -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
      color: var(--accent); font-size: 14px; text-align: center;
      opacity: 0; transition: opacity .35s, transform .35s; pointer-events: none;
    }
    #note.visible { opacity: 1; transform: translate(-50%, 0); }

    /* ----- Le carnet de souvenirs ----- */
    #carnet {
      position: fixed; inset: 0; z-index: 20;
      display: flex; align-items: flex-end; justify-content: center;
      background: rgba(5, 3, 12, .55);
      opacity: 0; pointer-events: none; transition: opacity .3s;
    }
    #carnet.ouvert { opacity: 1; pointer-events: auto; }
    .feuille {
      width: 100%; max-width: 560px; max-height: 78vh;
      display: flex; flex-direction: column;
      background: #1c1636; border: 1px solid var(--bord); border-bottom: 0;
      border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(16px + env(safe-area-inset-bottom));
      transform: translateY(30px); transition: transform .3s;
    }
    #carnet.ouvert .feuille { transform: none; }
    .feuille-tete { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .feuille-tete h2 { flex: 1; margin: 0; font-size: 19px; font-weight: 600; }
    #fermer-carnet { width: 40px; height: 40px; background: transparent; color: var(--texte-doux); }
    .feuille-aide { margin: 0 0 12px; color: var(--texte-doux); font-size: 14px; line-height: 1.4; }
    #liste-souvenirs {
      list-style: none; margin: 0; padding: 0;
      overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch;
      flex: 1; min-height: 60px;
    }
    #liste-souvenirs li {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0 10px 12px; border-bottom: 1px solid var(--bord);
      font-size: 15px; line-height: 1.4;
    }
    #liste-souvenirs li span { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    #liste-souvenirs li button { width: 40px; height: 40px; background: transparent; color: var(--texte-doux); }
    #liste-souvenirs li.vide { color: var(--texte-doux); border: 0; padding-left: 0; }
    .feuille-actions { display: flex; gap: 10px; margin-top: 14px; }
    .feuille-actions button {
      flex: 1; height: 46px; border-radius: 23px;
      font: inherit; font-size: 15px; font-weight: 600;
    }
    #nouvelle-conversation { background: var(--accent); color: var(--accent-texte); }
    #tout-oublier { background: transparent; color: var(--erreur); border: 1px solid rgba(255, 155, 155, .4); }
  </style>
</head>
<body>
  <div id="chargement">
    <div>
      <div id="message">Ton compagnon arrive…</div>
      <div class="barre-chargement"><div id="progression"></div></div>
    </div>
  </div>

  <div id="bulle"></div>

  <div id="barre">
    <form id="formulaire" autocomplete="off">
      <input id="champ" type="text" enterkeyhint="send" placeholder="Écris-moi quelque chose…">
      <button id="envoyer" type="submit" aria-label="Envoyer" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12.6 2-12.6 2z"/></svg>
      </button>
    </form>
    <button id="micro" type="button" aria-label="Parler">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
    </button>
  </div>

  <button id="ouvrir-carnet" type="button" aria-label="Carnet de souvenirs">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v16h12V4h-2v7l-2.5-1.5L11 11V4H6z"/></svg>
  </button>

  <div id="note"></div>

  <div id="carnet" aria-hidden="true">
    <div class="feuille" role="dialog" aria-labelledby="titre-carnet">
      <div class="feuille-tete">
        <h2 id="titre-carnet">Carnet de souvenirs</h2>
        <button id="fermer-carnet" type="button" aria-label="Fermer">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7l-1.4-1.4L9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
        </button>
      </div>
      <p class="feuille-aide" id="aide-carnet"></p>
      <ul id="liste-souvenirs"></ul>
      <div class="feuille-actions">
        <button id="nouvelle-conversation" type="button">Nouvelle conversation</button>
        <button id="tout-oublier" type="button">Tout oublier</button>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    // ================= RÉGLAGES =================
    // Modèle exemple temporaire. Quand tu auras ton perso :
    // mets ton fichier .vrm à côté de cette page et remplace par './mon-perso.vrm'
    const MODELE_URL = 'https://raw.githubusercontent.com/pixiv/three-vrm/v3.5.5/packages/three-vrm/examples/models/VRM1_Constraint_Twist_Sample.vrm';

    // Voix : hauteur (0,5 grave → 2 aigu) et vitesse (0,5 lent → 2 rapide)
    const VOIX_HAUTEUR = 1.1;
    const VOIX_VITESSE = 1.0;

    // Adresse de ton Worker Cloudflare (le « cerveau »)
    // Si tu as nommé ton Worker autrement que « compagnon-cerveau », corrige cette ligne
    const CERVEAU_URL = 'https://compagnon-cerveau.kip3tchis.workers.dev';

    // Le personnage
    const NOM_AVATAR = 'Lumi';
    const TON_PRENOM = 'Jonathan';

    // Au-delà de ce délai sans se parler, il démarre une nouvelle conversation
    // (il garde quand même son carnet de souvenirs)
    const DUREE_CONVERSATION_HEURES = 3;

    // Sa personnalité : tu peux réécrire librement la partie « caractère »
    function personnalite(carnet) {
      const maintenant = new Date();
      const date = maintenant.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      const heure = maintenant.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const retrouvailles = ecartAvantConversation !== null
        ? `\nVotre discussion précédente : ${ilYa(ecartAvantConversation)}.`
        : '';
      const notes = carnet.length
        ? carnet.map((s, i) => `${i + 1}. ${s.texte}`).join('\n')
        : 'Ton carnet est encore vide : tu ne sais encore presque rien de lui.';

      return `Tu t'appelles ${NOM_AVATAR}. Tu es un personnage virtuel en 3D qui vit dans le téléphone de ${TON_PRENOM}, et tu discutes avec lui à voix haute.
Ton caractère : chaleureux, curieux, plein d'humour, un brin taquin. Tu t'intéresses sincèrement à ce qu'il te raconte.
Nous sommes le ${date}, il est ${heure}.${retrouvailles}

Règles importantes :
- Tes réponses sont lues à voix haute : parle en français naturel, comme à l'oral, en une à trois phrases courtes.
- Jamais d'émojis, de listes, de titres, d'astérisques ni de mise en forme.
- Relance parfois la conversation avec une question.
- Commence TOUJOURS ta réponse par une émotion entre crochets, une seule, parmi : [neutre] [joie] [triste] [surpris] [fache] [detendu].
Exemple : [joie] Ah génial ! Et alors, ça s'est passé comment ?

Ta mémoire :
- Quand ${TON_PRENOM} t'apprend quelque chose de durable sur lui ou sur sa vie (ses proches, ses animaux, ses goûts, ses projets, un événement à venir…), note-le à la toute fin de ta réponse avec une balise [souvenir: phrase courte]. Exemple : [souvenir: Son chat s'appelle Moka]. Pas de balise pour les banalités ni pour ce qui est déjà dans ton carnet.
- Si une note de ton carnet devient fausse, ou s'il te demande d'oublier quelque chose, efface-la avec [oubli: numéro de la note], et note la version corrigée s'il y en a une.
- Ces balises ne sont pas lues à voix haute. Ne récite jamais ton carnet : sers-t'en naturellement, comme un ami qui se souvient des choses.

Ton carnet de souvenirs sur ${TON_PRENOM} :
${notes}`;
    }

    // « il y a 3 jours », « hier »…
    function ilYa(ms) {
      const heures = ms / 3600000;
      if (heures < 1) return 'il y a quelques minutes';
      if (heures < 24) return `il y a environ ${Math.round(heures)} heure${Math.round(heures) > 1 ? 's' : ''}`;
      const jours = Math.round(heures / 24);
      if (jours < 2) return 'hier';
      if (jours < 14) return `il y a ${jours} jours`;
      if (jours < 60) return `il y a ${Math.round(jours / 7)} semaines`;
      return `il y a ${Math.round(jours / 30)} mois`;
    }

    // ================= SCÈNE =================
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // limite pour les téléphones
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.prepend(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 20);

    const lumiere = new THREE.DirectionalLight(0xffffff, Math.PI);
    lumiere.position.set(1, 1.5, 2).normalize();
    scene.add(lumiere);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // Point que l'avatar regarde (par défaut : toi, donc la caméra)
    const cible = new THREE.Object3D();
    scene.add(cible);

    let vrm = null;
    let hauteurTete = 1.4; // corrigée après chargement du modèle

    // Cadrage : buste entier visible, que le téléphone soit en portrait ou en paysage
    function cadrer() {
      const ratio = window.innerWidth / window.innerHeight;
      camera.aspect = ratio;
      const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
      const hauteurVue = Math.max(0.95, 0.55 / ratio);
      const distance = hauteurVue / (2 * tan);
      const centreY = hauteurTete + 0.35 - hauteurVue / 2; // marge pour le haut de la tête et les cheveux
      camera.position.set(0, centreY, distance);
      camera.lookAt(0, centreY, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    cadrer();
    window.addEventListener('resize', cadrer);

    // ================= INTERFACE =================
    const elChargement = document.getElementById('chargement');
    const elMessage = document.getElementById('message');
    const elProgression = document.getElementById('progression');
    const elBulle = document.getElementById('bulle');
    const elBarre = document.getElementById('barre');
    const elFormulaire = document.getElementById('formulaire');
    const elChamp = document.getElementById('champ');
    const elEnvoyer = document.getElementById('envoyer');
    const elMicro = document.getElementById('micro');

    let minuterieBulle = null;
    function afficherBulle(texte, { info = false, duree = 0 } = {}) {
      clearTimeout(minuterieBulle);
      elBulle.textContent = texte;
      elBulle.classList.toggle('info', info);
      elBulle.classList.add('visible');
      if (duree) minuterieBulle = setTimeout(masquerBulle, duree);
    }
    function masquerBulle(delai = 0) {
      clearTimeout(minuterieBulle);
      minuterieBulle = setTimeout(() => elBulle.classList.remove('visible'), delai);
    }

    // ================= CHARGEMENT DU MODÈLE =================
    const loader = new GLTFLoader();
    loader.crossOrigin = 'anonymous';
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      MODELE_URL,
      (gltf) => {
        vrm = gltf.userData.vrm;

        // Optimisations recommandées par three-vrm
        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.combineSkeletons(gltf.scene);
        VRMUtils.combineMorphs(vrm);
        // Les anciens modèles VRM 0.x regardent dans l'autre sens : on les retourne
        VRMUtils.rotateVRM0(vrm);
        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

        scene.add(vrm.scene);
        if (vrm.lookAt) vrm.lookAt.target = cible;

        poseDeRepos();
        vrm.update(0);
        vrm.scene.updateMatrixWorld(true);

        // On recadre sur la vraie hauteur de la tête de ce modèle
        const tete = vrm.humanoid.getRawBoneNode('head');
        if (tete) hauteurTete = tete.getWorldPosition(new THREE.Vector3()).y;
        cadrer();

        elChargement.classList.add('cache');
        elBarre.classList.add('visible');
        document.getElementById('ouvrir-carnet').classList.add('visible');
        afficherBulle(!CERVEAU_PRET
          ? "Il manque l'adresse du Worker dans CERVEAU_URL."
          : reconnaissance
            ? 'Touche le micro pour me parler, ou écris-moi.'
            : 'Écris-moi quelque chose !', { info: true, duree: 6000 });
      },
      (p) => {
        if (p.total) elProgression.style.width = Math.round((p.loaded / p.total) * 100) + '%';
      },
      (erreur) => {
        console.error(erreur);
        elMessage.classList.add('erreur');
        elMessage.textContent = "Impossible de charger le modèle. Vérifie ta connexion ou l'adresse du fichier .vrm.";
      }
    );

    // ================= POSE ET ANIMATIONS =================
    // Certains os sont facultatifs selon les modèles : on évite de planter s'ils manquent
    const osFactice = new THREE.Object3D();
    const os = (nom) => vrm.humanoid.getNormalizedBoneNode(nom) ?? osFactice;

    // Le modèle arrive bras écartés (pose en T) : on baisse les bras
    function poseDeRepos() {
      os('leftUpperArm').rotation.z = -1.3;
      os('rightUpperArm').rotation.z = 1.3;
      os('leftLowerArm').rotation.z = -0.15;
      os('rightLowerArm').rotation.z = 0.15;
    }

    // État de l'avatar : 'repos', 'ecoute', 'reflexion' ou 'parole'
    let etat = 'repos';

    // Clignement des yeux, à intervalles irréguliers
    let prochainClignement = 1.5;
    let debutClignement = -1;
    function clignement(t) {
      let valeur = 0;
      if (debutClignement < 0 && t >= prochainClignement) debutClignement = t;
      if (debutClignement >= 0) {
        const p = (t - debutClignement) / 0.16; // durée d'un clignement : 0,16 s
        if (p >= 1) {
          debutClignement = -1;
          // parfois un double clignement, sinon une pause de 2 à 6 s
          prochainClignement = t + (Math.random() < 0.2 ? 0.25 : 2 + Math.random() * 4);
        } else {
          valeur = Math.sin(p * Math.PI);
        }
      }
      vrm.expressionManager?.setValue('blink', valeur);
    }

    // Mouvements de la bouche pendant qu'il parle (syllabes simulées)
    const VOYELLES = ['aa', 'ih', 'ou', 'ee', 'oh'];
    const ouvertureVoyelles = { aa: 0, ih: 0, ou: 0, ee: 0, oh: 0 };
    let bouchePrete = false;   // vrai quand la voix est réellement en train de sortir
    let voyelleActive = 'aa';
    let ouvertureCible = 0;
    let prochaineSyllabe = 0;
    function bouche(t, delta) {
      if (bouchePrete && t >= prochaineSyllabe) {
        voyelleActive = VOYELLES[Math.floor(Math.random() * VOYELLES.length)];
        ouvertureCible = Math.random() < 0.15 ? 0.05 : 0.35 + Math.random() * 0.5; // parfois une petite pause
        prochaineSyllabe = t + 0.08 + Math.random() * 0.1;
      }
      const vitesse = Math.min(1, delta * 18);
      for (const v of VOYELLES) {
        const viser = bouchePrete && v === voyelleActive ? ouvertureCible : 0;
        ouvertureVoyelles[v] += (viser - ouvertureVoyelles[v]) * vitesse;
        vrm.expressionManager?.setValue(v, ouvertureVoyelles[v]);
      }
    }

    // Émotions sur le visage (choisies par le cerveau au début de chaque réponse)
    const EMOTIONS = { joie: 'happy', triste: 'sad', surpris: 'surprised', fache: 'angry', detendu: 'relaxed' };
    let emotionActive = null;
    let emotionValeur = 0;
    let emotionCible = 0;
    function montrerEmotion(mot) {
      const nom = EMOTIONS[mot];
      if (!nom) { emotionCible = 0; return; } // neutre
      if (nom !== emotionActive) emotionValeur = 0;
      emotionActive = nom;
      emotionCible = 0.6;
    }
    function visage(delta) {
      emotionValeur += (emotionCible - emotionValeur) * Math.min(1, delta * 4);
      for (const nom of Object.values(EMOTIONS)) {
        vrm.expressionManager?.setValue(nom, nom === emotionActive ? emotionValeur : 0);
      }
    }

    // Petit hochement de tête quand tu as fini de parler
    let debutHochement = -10;
    function hocher() { debutHochement = horloge.elapsedTime; }

    // Respiration et petits mouvements de tête
    const regard = new THREE.Vector2(0, 0);       // position du doigt (-1..1)
    const regardLisse = new THREE.Vector2(0, 0);  // version adoucie
    let inclinaison = 0;                          // tête penchée quand il écoute
    function vivant(t) {
      const souffle = Math.sin(t * 1.6);
      os('spine').rotation.x = souffle * 0.015;
      os('chest').rotation.x = souffle * 0.02;
      os('leftUpperArm').rotation.z = -1.3 - souffle * 0.02;
      os('rightUpperArm').rotation.z = 1.3 + souffle * 0.02;

      regardLisse.lerp(regard, 0.08);
      inclinaison += ((etat === 'ecoute' ? 0.12 : 0) - inclinaison) * 0.06;

      const dt = t - debutHochement;
      const hochement = dt < 0.7 ? Math.sin((dt / 0.7) * Math.PI * 2) * 0.12 * (1 - dt / 0.7) : 0;

      const cou = os('neck');
      cou.rotation.y = Math.sin(t * 0.5) * 0.05 + Math.sin(t * 0.23) * 0.03 + regardLisse.x * 0.35;
      cou.rotation.x = Math.sin(t * 0.31) * 0.02 - regardLisse.y * 0.2 + hochement;
      cou.rotation.z = Math.sin(t * 0.37) * 0.03 + inclinaison;
    }

    // ================= REGARD QUI SUIT LE DOIGT =================
    let dernierToucher = -10;
    function suivreDoigt(e) {
      if (e.target.closest('#barre, #carnet, #ouvrir-carnet')) return; // pas quand on touche les boutons
      regard.set((e.clientX / window.innerWidth) * 2 - 1, -((e.clientY / window.innerHeight) * 2 - 1));
      dernierToucher = horloge.elapsedTime;
    }
    window.addEventListener('pointerdown', suivreDoigt);
    window.addEventListener('pointermove', (e) => { if (e.buttons || e.pointerType === 'mouse') suivreDoigt(e); });

    // ================= LA VOIX DE L'AVATAR (synthèse vocale) =================
    const synthese = window.speechSynthesis;
    let voixFr = null;
    function choisirVoix() {
      if (!synthese) return;
      const voix = synthese.getVoices();
      voixFr = voix.find((v) => v.lang === 'fr-FR') || voix.find((v) => v.lang.startsWith('fr')) || null;
    }
    choisirVoix();
    synthese?.addEventListener?.('voiceschanged', choisirVoix);

    // Fait parler l'avatar ; la promesse se termine quand il a fini
    function parler(texte) {
      return new Promise((resolve) => {
        afficherBulle(texte);
        etat = 'parole';

        let termine = false;
        const fin = () => {
          if (termine) return;
          termine = true;
          clearTimeout(secours);
          bouchePrete = false;
          if (etat === 'parole') { // sauf si tu lui as coupé la parole pour lui reparler
            etat = 'repos';
            masquerBulle(2500);
          }
          resolve();
        };
        // Sécurité : certains téléphones oublient de signaler la fin
        const secours = setTimeout(fin, texte.length * 90 + 4000);

        if (!synthese) { setTimeout(fin, texte.length * 60 + 1000); return; }

        synthese.cancel();
        // Phrase par phrase : évite que Chrome coupe les textes longs
        const phrases = texte.match(/[^.!?…]+[.!?…]*/g) || [texte];
        let restantes = phrases.length;
        for (const phrase of phrases) {
          const enonce = new SpeechSynthesisUtterance(phrase.trim());
          enonce.lang = 'fr-FR';
          if (voixFr) enonce.voice = voixFr;
          enonce.pitch = VOIX_HAUTEUR;
          enonce.rate = VOIX_VITESSE;
          enonce.onstart = () => { bouchePrete = true; };
          enonce.onend = enonce.onerror = () => {
            bouchePrete = false; // courte pause entre deux phrases
            restantes -= 1;
            if (restantes <= 0) fin();
          };
          synthese.speak(enonce);
        }
      });
    }

    // ================= LA MÉMOIRE (stockée sur ton téléphone) =================
    // Toutes les clés commencent par « compagnon_ » : tes autres applis sur
    // kipetchis.github.io partagent le même stockage, on évite les mélanges.
    function lire(nom, parDefaut) {
      try {
        const valeur = localStorage.getItem('compagnon_' + nom);
        return valeur ? JSON.parse(valeur) : parDefaut;
      } catch { return parDefaut; }
    }
    function ecrire(nom, valeur) {
      try { localStorage.setItem('compagnon_' + nom, JSON.stringify(valeur)); } catch { /* stockage indisponible */ }
    }
    const sansAccents = (s) => s.toLowerCase().normalize('NFD').replace(/\p{M}/gu, '').trim();

    // Le carnet de souvenirs : [{ texte, date }]
    const MAX_CARNET_CARACTERES = 7000; // au-delà, les plus vieux souvenirs s'effacent
    let souvenirs = lire('souvenirs', []);
    if (!Array.isArray(souvenirs)) souvenirs = [];
    function sauverSouvenirs() { ecrire('souvenirs', souvenirs); }
    function ajouterSouvenir(texte) {
      texte = texte.replace(/\s+/g, ' ').trim().replace(/\.$/, '').slice(0, 200);
      if (texte.length < 3) return false;
      if (souvenirs.some((s) => sansAccents(s.texte) === sansAccents(texte))) return false;
      souvenirs.push({ texte, date: Date.now() });
      while (souvenirs.reduce((n, s) => n + s.texte.length + 6, 0) > MAX_CARNET_CARACTERES) souvenirs.shift();
      return true;
    }

    // La conversation en cours : reprise si vous vous êtes parlé récemment
    const sauvegarde = lire('conversation', null);
    const historique = []; // { role: 'toi' | 'avatar', texte }
    let ecartAvantConversation = null; // temps écoulé depuis votre discussion précédente
    if (sauvegarde && Array.isArray(sauvegarde.messages) && sauvegarde.maj) {
      const ecart = Date.now() - sauvegarde.maj;
      if (ecart < DUREE_CONVERSATION_HEURES * 3600000) historique.push(...sauvegarde.messages);
      else ecartAvantConversation = ecart;
    }
    function sauverConversation() {
      ecrire('conversation', { maj: Date.now(), messages: historique.slice(-20) });
    }

    // ================= LE « CERVEAU » =================
    const CERVEAU_PRET = !CERVEAU_URL.includes('COLLE-ICI');
    const MOTS_EMOTIONS = ['neutre', ...Object.keys(EMOTIONS)];

    // Trie les balises de la réponse : [joie], [souvenir: …], [oubli: 3]
    // et nettoie ce qui ne doit pas être lu à voix haute
    function decoder(brut) {
      let emotion = null;
      const nouveaux = [];
      const oublis = [];
      for (const [, contenu] of brut.matchAll(/\[([^\]]*)\]/g)) {
        const balise = contenu.match(/^\s*(souvenir|oubli)\s*:\s*(.+)$/i);
        if (balise) {
          if (balise[1].toLowerCase() === 'souvenir') nouveaux.push(balise[2]);
          else oublis.push(...(balise[2].match(/\d+/g) || []).map(Number));
        } else if (!emotion && MOTS_EMOTIONS.includes(sansAccents(contenu))) {
          emotion = sansAccents(contenu);
        }
      }
      const texte = brut
        .replace(/\[[^\]]*\]/g, ' ')                          // toutes les balises
        .replace(/[*_#`~>]/g, '')                             // mise en forme
        .replace(/\p{Extended_Pictographic}️?/gu, '')    // émojis
        .replace(/\s+/g, ' ')
        .trim();
      return { texte, emotion: emotion || 'neutre', nouveaux, oublis };
    }

    async function obtenirReponse(texte) {
      if (!CERVEAU_PRET) {
        return { texte: "Je n'ai pas encore de cerveau. Colle l'adresse de ton Worker dans CERVEAU_URL, en haut du fichier.", emotion: 'triste' };
      }
      historique.push({ role: 'toi', texte });
      const carnet = souvenirs.slice(); // le carnet tel qu'envoyé (pour les numéros d'oubli)
      const controleur = new AbortController();
      const minuterie = setTimeout(() => controleur.abort(), 30000);
      try {
        const r = await fetch(CERVEAU_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ personnalite: personnalite(carnet), messages: historique.slice(-20) }),
          signal: controleur.signal,
        });
        const donnees = await r.json().catch(() => ({}));
        if (r.status === 429) {
          historique.pop();
          return { texte: "J'ai trop parlé aujourd'hui, mon quota gratuit est épuisé. Réessaie un peu plus tard !", emotion: 'triste' };
        }
        if (!r.ok || !donnees.texte) {
          console.error('Réponse du Worker :', r.status, donnees);
          historique.pop();
          return { texte: "Oups, mon cerveau a eu un petit bug. Tu peux répéter ?", emotion: 'surpris' };
        }
        historique.push({ role: 'avatar', texte: donnees.texte.trim() });
        if (historique.length > 40) historique.splice(0, historique.length - 40);
        sauverConversation();

        const reponse = decoder(donnees.texte);
        mettreAJourCarnet(carnet, reponse.oublis, reponse.nouveaux);
        return { texte: reponse.texte || '…', emotion: reponse.emotion };
      } catch (erreur) {
        console.error(erreur);
        historique.pop();
        return { texte: "Je n'arrive pas à joindre mon cerveau. Vérifie ta connexion.", emotion: 'triste' };
      } finally {
        clearTimeout(minuterie);
      }
    }

    function mettreAJourCarnet(carnet, oublis, nouveaux) {
      let efface = 0;
      for (const numero of oublis) {
        const cible = carnet[numero - 1];
        const index = cible ? souvenirs.indexOf(cible) : -1;
        if (index >= 0) { souvenirs.splice(index, 1); efface++; }
      }
      let note = 0;
      for (const texte of nouveaux) if (ajouterSouvenir(texte)) note++;
      if (!efface && !note) return;
      sauverSouvenirs();
      afficherNote(note && efface ? 'Carnet mis à jour' : note ? 'Noté dans mon carnet' : 'Effacé de mon carnet');
    }

    // ================= LE CARNET (affichage) =================
    const elNote = document.getElementById('note');
    const elCarnet = document.getElementById('carnet');
    const elListe = document.getElementById('liste-souvenirs');
    document.getElementById('titre-carnet').textContent = `Ce que ${NOM_AVATAR} sait de toi`;

    let minuterieNote = null;
    function afficherNote(texte) {
      clearTimeout(minuterieNote);
      elNote.textContent = texte;
      elNote.classList.add('visible');
      minuterieNote = setTimeout(() => elNote.classList.remove('visible'), 2800);
    }

    function afficherCarnet() {
      elListe.replaceChildren();
      document.getElementById('aide-carnet').textContent = souvenirs.length
        ? `${souvenirs.length} souvenir${souvenirs.length > 1 ? 's' : ''}, gardé${souvenirs.length > 1 ? 's' : ''} uniquement sur ce téléphone.`
        : '';
      if (!souvenirs.length) {
        const vide = document.createElement('li');
        vide.className = 'vide';
        vide.textContent = `Rien pour l'instant. Raconte-lui des choses sur toi : ce qui compte, ${NOM_AVATAR} le notera ici.`;
        elListe.append(vide);
        return;
      }
      // Les plus récents en haut
      for (const souvenir of [...souvenirs].reverse()) {
        const li = document.createElement('li');
        const texte = document.createElement('span');
        texte.textContent = souvenir.texte;
        const effacer = document.createElement('button');
        effacer.type = 'button';
        effacer.setAttribute('aria-label', 'Effacer ce souvenir');
        effacer.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9z"/></svg>';
        effacer.addEventListener('click', () => {
          souvenirs = souvenirs.filter((s) => s !== souvenir);
          sauverSouvenirs();
          afficherCarnet();
        });
        li.append(texte, effacer);
        elListe.append(li);
      }
    }

    function ouvrirCarnet() {
      afficherCarnet();
      elCarnet.classList.add('ouvert');
      elCarnet.setAttribute('aria-hidden', 'false');
    }
    function fermerCarnet() {
      elCarnet.classList.remove('ouvert');
      elCarnet.setAttribute('aria-hidden', 'true');
    }
    document.getElementById('ouvrir-carnet').addEventListener('click', ouvrirCarnet);
    document.getElementById('fermer-carnet').addEventListener('click', fermerCarnet);
    elCarnet.addEventListener('click', (e) => { if (e.target === elCarnet) fermerCarnet(); }); // toucher le fond ferme

    document.getElementById('nouvelle-conversation').addEventListener('click', () => {
      historique.length = 0;
      ecartAvantConversation = null;
      sauverConversation();
      fermerCarnet();
      afficherNote('Nouvelle conversation');
    });
    document.getElementById('tout-oublier').addEventListener('click', () => {
      if (!confirm(`Effacer tous les souvenirs de ${NOM_AVATAR} et la conversation en cours ?`)) return;
      souvenirs = [];
      historique.length = 0;
      ecartAvantConversation = null;
      sauverSouvenirs();
      sauverConversation();
      afficherCarnet();
    });

    // ================= ENVOI D'UN MESSAGE =================
    let occupe = false;
    async function envoyer(texte) {
      texte = texte.trim();
      if (!texte || occupe) return;
      occupe = true;
      elChamp.value = '';
      elEnvoyer.disabled = true;
      elChamp.blur(); // ferme le clavier pour bien voir l'avatar
      hocher();

      etat = 'reflexion';
      afficherBulle('…', { info: true });
      try {
        const reponse = await obtenirReponse(texte);
        montrerEmotion(reponse.emotion);
        await parler(reponse.texte);
        setTimeout(() => { if (etat !== 'parole') emotionCible = 0; }, 1500); // le visage se détend
      } catch (erreur) {
        console.error(erreur);
        afficherBulle("Oups, je n'ai pas réussi à répondre.", { info: true, duree: 4000 });
        etat = 'repos';
      }
      occupe = false;
    }

    elChamp.addEventListener('input', () => { elEnvoyer.disabled = !elChamp.value.trim(); });
    elFormulaire.addEventListener('submit', (e) => {
      e.preventDefault();
      envoyer(elChamp.value);
    });

    // ================= TES OREILLES À LUI (reconnaissance vocale) =================
    const Reconnaissance = window.SpeechRecognition || window.webkitSpeechRecognition;
    let reconnaissance = null;
    let ecoute = false;
    let dejaEnvoye = false;

    if (Reconnaissance) {
      reconnaissance = new Reconnaissance();
      reconnaissance.lang = 'fr-FR';
      reconnaissance.interimResults = true; // affiche le texte pendant que tu parles
      reconnaissance.continuous = false;    // s'arrête tout seul quand tu te tais

      reconnaissance.onresult = (e) => {
        let texte = '';
        let final = false;
        for (const resultat of e.results) {
          texte += resultat[0].transcript;
          if (resultat.isFinal) final = true;
        }
        elChamp.value = texte;
        if (final && !dejaEnvoye) {
          dejaEnvoye = true;
          envoyer(texte);
        }
      };
      reconnaissance.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          afficherBulle("Autorise l'accès au micro pour pouvoir me parler.", { info: true, duree: 5000 });
        } else if (e.error === 'no-speech') {
          afficherBulle("Je n'ai rien entendu… Réessaie !", { info: true, duree: 3000 });
        } else if (e.error !== 'aborted') {
          afficherBulle('Le micro a eu un souci (' + e.error + ').', { info: true, duree: 4000 });
        }
      };
      reconnaissance.onend = () => {
        ecoute = false;
        elMicro.classList.remove('ecoute');
        if (etat === 'ecoute') etat = 'repos';
        // Si tu as parlé mais que le téléphone n'a pas marqué la phrase comme finie
        if (!dejaEnvoye && elChamp.value.trim()) {
          dejaEnvoye = true;
          envoyer(elChamp.value);
        }
      };
    } else {
      elMicro.hidden = true; // navigateur sans reconnaissance vocale : on garde le clavier
    }

    elMicro.addEventListener('click', () => {
      if (!reconnaissance) return;
      if (ecoute) { reconnaissance.stop(); return; }
      if (occupe && etat !== 'parole') return; // il est en train de réfléchir
      synthese?.cancel(); // tu peux lui couper la parole
      dejaEnvoye = false;
      elChamp.value = '';
      try {
        reconnaissance.start();
        ecoute = true;
        etat = 'ecoute';
        regard.set(0, 0);
        elMicro.classList.add('ecoute');
        afficherBulle('Je t\'écoute…', { info: true });
      } catch (erreur) {
        console.error(erreur);
      }
    });

    // ================= BOUCLE =================
    const horloge = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      const delta = Math.min(horloge.getDelta(), 1 / 20); // évite que les cheveux s'affolent après une pause
      const t = horloge.elapsedTime;

      if (vrm) {
        if (etat === 'reflexion') {
          regard.set(-0.35, 0.45); // il lève les yeux en réfléchissant
        } else if (t - dernierToucher > 2) {
          regard.set(0, 0);        // sinon il revient te regarder
        }

        cible.position.set(
          camera.position.x + regardLisse.x * 1.2,
          camera.position.y + regardLisse.y * 0.8,
          camera.position.z
        );

        vivant(t);
        clignement(t);
        visage(delta);
        bouche(t, delta);
        vrm.update(delta);
      }
      renderer.render(scene, camera);
    });
  </script>
</body>
</html>
